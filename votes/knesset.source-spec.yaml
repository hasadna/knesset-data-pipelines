view_vote_mk_individual:
  dpp_disabled: true  # migrated to airflow
  pipeline-type: knesset dataservice
  schemas-bucket: votes
  dataservice-parameters:
    odata-v4: false
    resource-name: view_vote_mk_individual
    service-name: votes
    method-name: "View_Vote_MK_Individual"
    fields:
      vip_id:
        source: "{name}"
        type: string
        description: vip id
        primaryKey: true
      mk_individual_id:
        source: "{name}"
        type: integer
        description: mk individual id
      mk_individual_name:
        source: "{name}"
        type: string
        description: Last Name Hebrew
      mk_individual_name_eng:
        source: "{name}"
        type: string
        description: Last Name English
      mk_individual_first_name:
        source: "{name}"
        type: string
        description: First Name
      mk_individual_first_name_eng:
        source: "{name}"
        type: string
        description: First Name English

vote_result_type:
  dpp_disabled: true  # migrated to airflow
  pipeline-type: knesset dataservice
  schemas-bucket: votes
  dataservice-parameters:
    odata-v4: false
    resource-name: vote_result_type
    service-name: votes
    method-name: "vote_result_type"
    fields:
      result_type_id:
        source: "{name}"
        type: integer
        description: id
        primaryKey: true
      result_type_name:
        source: "{name}"
        type: string
        description: result name

vote_rslts_kmmbr_shadow:
  description: פירוט איזה חבר כנסת הצביע באיזה אופן בכל הצבעה
  dpp_disabled: true  # migrated to airflow
  pipeline-type: knesset dataservice
  schemas-bucket: votes
  dataservice-parameters:
    odata-v4: false
#    incremental-field: vote_id
#    incremental-field-type: integer
#    incremental-field-key: [vote_id, kmmbr_id]
    resource-name: vote_rslts_kmmbr_shadow
    service-name: votes
    method-name: "vote_rslts_kmmbr_shadow"
    fields:
      vote_id:
        source: "{name}"
        type: integer
        description: vote id
        primaryKey: true
      kmmbr_id:
        source: "{name}"
        type: string
        description: knesset member id
        primaryKey: true
      kmmbr_name:
        source: "{name}"
        type: string
        description: knesset member name
      vote_result:
        source: "{name}"
        type: integer
        description: vote result fk for vote result type
      knesset_num:
        source: "{name}"
        type: integer
        description: knesset num
      faction_id:
        source: "{name}"
        type: integer
        description: faction id
      faction_name:
        source: "{name}"
        type: string
        description: faction name
      reason:
        source: "{name}"
        type: integer
        description: reason
      modifier:
        source: "{name}"
        type: string
        description: modifier
      remark:
        source: "{name}"
        type: string
        description: remark


