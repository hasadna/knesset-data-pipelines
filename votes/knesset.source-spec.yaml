view_vote_rslts_hdr_approved:
  description: נתונים אודות הצבעות, כולל כמה הצביעו בעד/נגד/נמנעים
  dpp_disabled: true  # migrated to airflow
  pipeline-type: knesset dataservice
  schemas-bucket: votes
  dataservice-parameters:
    odata-v4: false
    resource-name: view_vote_rslts_hdr_approved
    service-name: votes
    method-name: "View_vote_rslts_hdr_Approved"
    fields:
      vote_id:
        source: "{name}"
        type: integer
        description: the primary key
        primaryKey: true
      knesset_num:
        source: "{name}"
        type: integer
        description: knesset number
      session_id:
        source: "{name}"
        type: string
        description: session id
      sess_item_nbr:
        source: "{name}"
        type: integer
        description: sess_item_nbr
      sess_item_id:
        source: "{name}"
        type: string
        description: sess_item_id
      sess_item_dscr:
        source: "{name}"
        type: string
        description: sess_item_dscr
      vote_item_id:
        source: "{name}"
        type: string
        description: vote item id
      vote_item_dscr:
        source: "{name}"
        type: string
        description: item_dscr
      vote_date:
        source: "{name}"
        type: datetime
        description: vote date
      vote_time:
        source: "{name}"
        # cant convert simply to time : TODO figure out how to represent it properly
        type: string
        description: vote time
#          datetime:
#            source: date
#            type: datetime
#            description: date time
      is_elctrnc_vote:
        source: "{name}"
        type: integer
        description: is_elctrnc_vote
      vote_type:
        source: "{name}"
        type: integer
        description: type
      is_accepted:
        source: "{name}"
        type: integer
        description: is_accepted
      total_for:
        source: "{name}"
        type: integer
        description: total_for
      total_against:
        source: "{name}"
        type: integer
        description: total_against
      total_abstain:
        source: "{name}"
        type: integer
        description: total_abstain
      vote_stat:
        source: "{name}"
        type: integer
        description: vote stat
      session_num:
        source: "{name}"
        type: integer
        description: session_num
      vote_nbr_in_sess:
        source: "{name}"
        type: integer
        description: nbr_in_sess
      reason:
        source: "{name}"
        type: integer
        description: reason
      modifier:
        source: "{name}"
        type: string
        description: modifier
      remark:
        source: "{name}"
        type: string
        description: remark

