v_lobbyist:
  description: "שדלנים"
  dpp_disabled: true  # migrated to airflow
  pipeline-type: knesset dataservice
  schemas-bucket: "lobbyists"
  dataservice-parameters:
    odata-v4: false
    resource-name: v_lobbyist
    service-name: lobbyists
    method-name: "V_Lobbyists"
    fields:
      LobbyistID:
        source: "{name}"
        type: integer
        description: קוד השדלן
        primaryKey: true
      IdentityNumber:
        source: "{name}"
        type: string
        description: מספר זהות
        primaryKey: true
      FullName:
        source: "{name}"
        type: string
        description: שם מלא
        primaryKey: true
      PermitTypeValue:
        source: "{name}"
        type: string
        description: סוג היתר
        primaryKey: true
      Key:
        source: "{name}"
        type: integer
        description: מפתח
        primaryKey: true
      CorporationName:
        source: "{name}"
        type: string
        description: שם חברה
      IsIndependent:
        source: "{name}"
        type: boolean
        description: האם עצמאי
      CorpNumber:
        source: "{name}"
        type: integer
        description: מספר חברה
      PracticeFramework:
        source: "{name}"
        type: string
        description: מסגרת
      IsMemberInFaction:
        source: "{name}"
        type: string
        description: האם חבר בסיעה
      MemberInFaction:
        source: "{name}"
        type: boolean
        description: חבר בסיעה
        primaryKey: true


v_lobbyist_clients:
  description: "לקוחות של שדלנים"
  dpp_disabled: true  # migrated to airflow
  pipeline-type: knesset dataservice
  schemas-bucket: "lobbyists"
  dataservice-parameters:
    odata-v4: false
    resource-name: v_lobbyist_clients
    service-name: lobbyists
    method-name: "V_LobbyistsClients"
    fields:
      LobbyistID:
        source: "{name}"
        type: integer
        description: קוד השדלן
        primaryKey: true
      ClientID:
        source: "{name}"
        type: integer
        description: קוד הלקוח
        primaryKey: true
      Name:
        source: "{name}"
        type: string
        description: שם
        primaryKey: true
      ClientsNames:
        source: "{name}"
        type: string
        description: שמות הלקוחות
        primaryKey: true
